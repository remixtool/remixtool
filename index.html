<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remix Market | متجر ريمكس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* إضافة الخلفية المتحركة */
        body { 
            background: linear-gradient(270deg, #0f172a, #1e1b4b, #0f172a);
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
            color: #f8fafc; 
            font-family: sans-serif; 
            min-height: 100vh;
        }
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .tab-btn.active { background-color: #2563eb; color: white; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- الهيدر واسم المنصة -->
    <header class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8 bg-slate-900/60 backdrop-blur-md p-4 rounded-2xl shadow-lg border border-slate-700">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-3 rounded-xl shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-store text-2xl text-white"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 tracking-wide">
                    REMIX MARKET
                </h1>
                <p class="text-xs text-slate-400 font-semibold">متجر ريمكس للألعاب والتطبيقات والكتب</p>
            </div>
        </div>

        <!-- خانة البحث -->
        <div class="relative w-full md:w-1/3">
            <input type="text" id="searchInput" onkeyup="searchContent()" placeholder="ابحث عن لعبة، تطبيق، أو كتاب..." 
                class="w-full bg-slate-950/50 border border-slate-700 text-white rounded-xl py-2 px-4 pr-10 focus:outline-none focus:border-blue-500">
            <i class="fa-solid fa-search absolute left-3 top-3 text-slate-400"></i>
        </div>

        <!-- زر النشر -->
        <button onclick="toggleModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-5 rounded-xl flex items-center gap-2 transition-all w-full md:w-auto justify-center shadow-lg shadow-emerald-900/40">
            <i class="fa-solid fa-cloud-arrow-up"></i> انشر مجاناً
        </button>
    </header>

    <!-- مكان الإعلان -->
    <div class="bg-slate-900/60 backdrop-blur-md border border-amber-500/30 rounded-xl p-3 text-center text-xs text-amber-400 mb-8">
        📢 إعلان (هنا ستضع شفرة إعلاناتك لتحويل الأرباح لمحفظتك)
    </div>

    <!-- الخيارات -->
    <div class="flex justify-center gap-2 mb-8 bg-slate-900/60 backdrop-blur-md p-1.5 rounded-2xl max-w-md mx-auto border border-slate-700">
        <button onclick="switchTab('games')" id="tab-games" class="tab-btn active w-1/3 py-2 rounded-xl text-sm font-bold transition-all">🎮 ألعاب</button>
        <button onclick="switchTab('apps')" id="tab-apps" class="tab-btn w-1/3 py-2 rounded-xl text-sm font-bold transition-all">📱 تطبيقات</button>
        <button onclick="switchTab('books')" id="tab-books" class="tab-btn w-1/3 py-2 rounded-xl text-sm font-bold transition-all">📚 كتب</button>
    </div>

    <!-- شبكة المحتوى -->
    <main id="contentGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- المحتوى -->
    </main>

    <!-- نافذة رفع الملفات -->
    <div id="uploadModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 p-6 rounded-2xl max-w-md w-full border border-slate-700 relative shadow-2xl">
            <button onclick="toggleModal()" class="absolute top-4 left-4 text-slate-400 hover:text-white text-xl">✕</button>
            <h2 class="text-xl font-bold mb-4 text-emerald-400 flex items-center gap-2">
                <i class="fa-solid fa-circle-plus"></i> إضافة محتوى إلى Remix Market
            </h2>
            <form onsubmit="handleUpload(event)" class="space-y-4 text-sm">
                <div>
                    <label class="block mb-1 text-slate-300">النوع:</label>
                    <select id="itemType" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                        <option value="games">لعبة</option>
                        <option value="apps">تطبيق</option>
                        <option value="books">كتاب</option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1 text-slate-300">اسم العنصر:</label>
                    <input type="text" id="itemName" required placeholder="مثال: لعبة Free Fire" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                </div>
                <div>
                    <label class="block mb-1 text-slate-300">رابط الأيقونة:</label>
                    <input type="url" id="itemIcon" required placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                </div>
                <div>
                    <label class="block mb-1 text-slate-300">رابط التحميل:</label>
                    <input type="url" id="itemLink" required placeholder="رابط Google Drive..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-xl transition-all text-white">
                    نشر فوراً
                </button>
            </form>
        </div>
    </div>

    <script>
        const items = [
            { id: 1, type: 'games', name: 'لعبة مغامرات 3D', icon: 'https://cdn-icons-png.flaticon.com/512/686/686589.png', link: '#' },
            { id: 2, type: 'apps', name: 'تطبيق تعديل الصور', icon: 'https://cdn-icons-png.flaticon.com/512/2965/2965318.png', link: '#' },
            { id: 3, type: 'books', name: 'كتاب تعلم البرمجة', icon: 'https://cdn-icons-png.flaticon.com/512/2232/2232688.png', link: '#' }
        ];

        let currentTab = 'games';

        function renderItems(filterText = '') {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = '';
            const filtered = items.filter(i => i.type === currentTab && i.name.toLowerCase().includes(filterText.toLowerCase()));
            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">لا يوجد محتوى حالياً في هذا القسم.</div>`;
                return;
            }
            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-slate-900/60 backdrop-blur-md p-4 rounded-2xl border border-slate-700 flex flex-col items-center text-center hover:border-blue-500/50 transition-all">
                        <img src="${item.icon}" class="w-20 h-20 rounded-2xl mb-3 object-cover bg-slate-950 p-2">
                        <h3 class="font-bold text-white mb-2">${item.name}</h3>
                        <a href="${item.link}" target="_blank" class="mt-auto w-full bg-blue-600 hover:bg-blue-500 py-2 rounded-xl text-xs font-bold transition-all text-white shadow-lg shadow-blue-900/30">
                            تنزيل / فتح
                        </a>
                    </div>
                `;
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            renderItems();
        }

        function searchContent() {
            const txt = document.getElementById('searchInput').value;
            renderItems(txt);
        }

        function toggleModal() {
            document.getElementById('uploadModal').classList.toggle('hidden');
        }

        function handleUpload(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                type: document.getElementById('itemType').value,
                name: document.getElementById('itemName').value,
                icon: document.getElementById('itemIcon').value,
                link: document.getElementById('itemLink').value
            };
            items.push(newItem);
            toggleModal();
            switchTab(newItem.type);
            alert("تم نشر المحتوى بنجاح في Remix Market!");
        }

        renderItems();
    </script>
</body>
</html>
