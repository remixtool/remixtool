<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remox Zone | متجر الألعاب والتطبيقات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #e6edf3; font-family: system-ui, -apple-system, sans-serif; }
        .nav-item.active { color: #38bdf8; }
        .nav-item.active i { background: #1f6beb; color: #ffffff; padding: 6px 18px; border-radius: 20px; box-shadow: 0 4px 12px rgba(31,107,235,0.4); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        /* تأثير إضاءة اللوجو الملحمي */
        .epic-logo-glow {
            filter: drop-shadow(0px 0px 8px rgba(56, 189, 248, 0.6)) drop-shadow(0px 0px 15px rgba(168, 85, 247, 0.4));
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0px 0px 6px rgba(56, 189, 248, 0.5)) drop-shadow(0px 0px 10px rgba(168, 85, 247, 0.3)); }
            100% { filter: drop-shadow(0px 0px 12px rgba(56, 189, 248, 0.9)) drop-shadow(0px 0px 20px rgba(168, 85, 247, 0.7)); }
        }
    </style>
</head>
<body class="pb-28">

    <header class="sticky top-0 bg-[#0b0f19]/95 backdrop-blur-md z-50 px-4 pt-3 pb-2 border-b border-slate-800">
        <div class="flex items-center justify-between gap-3 bg-slate-900/90 rounded-full px-3.5 py-1.5 border border-slate-800 shadow-xl">
            
            <div class="flex items-center gap-2.5 cursor-pointer" onclick="switchTab('games')">
                <div class="w-10 h-10 flex items-center justify-center epic-logo-glow">
                    <svg viewBox="0 0 100 100" class="w-full h-full">
                        <defs>
                            <linearGradient id="epicGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#38bdf8" />
                                <stop offset="50%" stop-color="#3b82f6" />
                                <stop offset="100%" stop-color="#a855f7" />
                            </linearGradient>
                            <linearGradient id="epicGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#f43f5e" />
                                <stop offset="100%" stop-color="#8b5cf6" />
                            </linearGradient>
                        </defs>
                        <polygon points="50,5 90,25 90,65 50,95 10,65 10,25" fill="none" stroke="url(#epicGrad1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M20 35 L40 50 L20 65 M80 35 L60 50 L80 65" fill="none" stroke="url(#epicGrad2)" stroke-width="3" stroke-linecap="round"/>
                        <path d="M32 45 C32 40, 40 38, 50 38 C60 38, 68 40, 68 45 C68 55, 62 65, 58 65 C55 65, 53 60, 50 60 C47 60, 45 65, 42 65 C38 65, 32 55, 32 45 Z" fill="#0b0f19" stroke="url(#epicGrad1)" stroke-width="2.5"/>
                        <circle cx="41" cy="48" r="2" fill="#38bdf8"/>
                        <circle cx="59" cy="46" r="1.5" fill="#f43f5e"/>
                        <circle cx="63" cy="50" r="1.5" fill="#10b981"/>
                    </svg>
                </div>
                <div class="flex flex-col">
                    <span class="font-black text-sm tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500">REMIX ZONE</span>
                    <span class="text-[8px] text-cyan-400/80 -mt-1 font-semibold tracking-widest">OFFICIAL STORE</span>
                </div>
            </div>

            <div class="flex-1 flex items-center gap-2 px-3 bg-slate-950/80 py-1.5 rounded-full border border-slate-800">
                <i class="fa-solid fa-magnifying-glass text-slate-500 text-xs"></i>
                <input type="text" id="searchInput" onkeyup="searchContent()" placeholder="بحث عن لعبة أو تطبيق..." 
                    class="w-full bg-transparent text-xs text-white placeholder-slate-500 focus:outline-none">
            </div>

            <button onclick="switchTab('account')" class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 to-purple-600 text-white font-black text-xs flex items-center justify-center shadow-lg border border-cyan-400/30">
                R
            </button>
        </div>
    </header>

    <div class="mx-4 mt-3 p-2 bg-slate-900/60 border border-amber-500/30 rounded-xl text-center text-xs text-amber-400 font-medium">
        📢 مساحة إعلانات Adsterra المباشرة للربح
    </div>

    <main class="px-4 pt-4">

        <h2 id="sectionTitle" class="text-sm font-bold text-slate-200 mb-3 flex items-center justify-between">
            <span>الألعاب المتاحة</span>
        </h2>

        <div id="contentGrid" class="space-y-3">
            </div>

        <div id="accountSection" class="hidden space-y-4">
            <div class="bg-slate-900/90 p-5 rounded-2xl border border-slate-800 text-center shadow-xl">
                <div class="w-16 h-16 bg-gradient-to-tr from-cyan-500 to-purple-600 text-white font-black text-2xl rounded-full flex items-center justify-center mx-auto mb-2 shadow-lg epic-logo-glow">
                    R
                </div>
                <h3 class="font-bold text-base text-white">حساب Remox</h3>
                <p class="text-xs text-slate-400 mb-2">منصة النشر المباشرة للمتجر</p>
            </div>

            <div class="bg-slate-900/90 p-5 rounded-2xl border border-slate-800 shadow-xl">
                <h4 class="font-bold text-sm text-cyan-400 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> نشر تطبيق أو لعبة جديدة
                </h4>
                <form onsubmit="handleUpload(event)" class="space-y-3 text-xs">
                    <div>
                        <label class="block text-slate-400 mb-1">القسم:</label>
                        <select id="itemType" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none">
                            <option value="games">لعبة</option>
                            <option value="apps">تطبيق</option>
                            <option value="books">كتاب</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">اسم اللعبة / التطبيق:</label>
                        <input type="text" id="itemName" required placeholder="اسم التطبيق..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">الوصف القصير / التصنيف:</label>
                        <input type="text" id="itemCategory" required placeholder="مثال: أكشن • مغامرات" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">رابط صورة الأيقونة:</label>
                        <input type="url" id="itemIcon" required placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">رابط التحميل المباشر:</label>
                        <input type="url" id="itemLink" required placeholder="رابط Google Drive أو Mediafire..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none">
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition-all">
                        نشر في المتجر الآن
                    </button>
                </form>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-0 inset-x-0 bg-slate-950/95 backdrop-blur-lg border-t border-slate-800 px-2 py-2 flex justify-around items-center z-50">
        <button onclick="switchTab('games')" id="nav-games" class="nav-item active flex flex-col items-center gap-1 text-[10px] text-slate-400">
            <i class="fa-solid fa-gamepad text-base"></i>
            <span>الألعاب</span>
        </button>
        <button onclick="switchTab('apps')" id="nav-apps" class="nav-item flex flex-col items-center gap-1 text-[10px] text-slate-400">
            <i class="fa-solid fa-shapes text-base"></i>
            <span>التطبيقات</span>
        </button>
        <button onclick="switchTab('books')" id="nav-books" class="nav-item flex flex-col items-center gap-1 text-[10px] text-slate-400">
            <i class="fa-solid fa-book-open text-base"></i>
            <span>الكتب</span>
        </button>
        <button onclick="switchTab('account')" id="nav-account" class="nav-item flex flex-col items-center gap-1 text-[10px] text-slate-400">
            <i class="fa-solid fa-user-gear text-base"></i>
            <span>الحساب والنشر</span>
        </button>
    </nav>

    <script>
        let items = JSON.parse(localStorage.getItem('remox_items')) || [];
        let currentTab = 'games';

        function renderItems(filterText = '') {
            const grid = document.getElementById('contentGrid');
            const accountSec = document.getElementById('accountSection');
            const title = document.getElementById('sectionTitle');

            if(currentTab === 'account') {
                grid.classList.add('hidden');
                title.classList.add('hidden');
                accountSec.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            title.classList.remove('hidden');
            accountSec.classList.add('hidden');
            grid.innerHTML = '';

            const filtered = items.filter(i => i.type === currentTab && i.name.toLowerCase().includes(filterText.toLowerCase()));

            if(filtered.length === 0) {
                grid.innerHTML = `
                    <div class="text-center py-12 text-slate-500 text-xs">
                        <i class="fa-solid fa-box-open text-3xl mb-2 text-slate-600 block"></i>
                        لا توجد عناصر مضافة في هذا القسم حالياً.<br>قم بنشر تطبيقك الأول من قسم الحساب!
                    </div>`;
                return;
            }

            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-slate-900/80 p-3 rounded-2xl flex items-center justify-between gap-3 border border-slate-800">
                        <div class="flex items-center gap-3">
                            <img src="${item.icon}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2589/2589175.png'" class="w-12 h-12 rounded-xl object-cover bg-slate-950 p-1 border border-slate-800">
                            <div>
                                <h3 class="font-bold text-white text-xs mb-0.5">${item.name}</h3>
                                <p class="text-[10px] text-slate-400">${item.category}</p>
                                <span class="text-[10px] text-amber-400 font-bold">${item.rating}</span>
                            </div>
                        </div>
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-1.5 rounded-full text-xs transition-all shadow-md">
                            تثبيت
                        </a>
                    </div>
                `;
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`nav-${tab}`).classList.add('active');
            
            const titles = { games: 'الألعاب المتاحة', apps: 'التطبيقات المتاحة', books: 'الكتب الرقمية', account: 'إدارة الحساب والنشر' };
            document.getElementById('sectionTitle').innerHTML = `<span>${titles[tab]}</span>`;
            
            renderItems();
        }

        function searchContent() {
            const txt = document.getElementById('searchInput').value;
            renderItems(txt);
        }

        function handleUpload(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                type: document.getElementById('itemType').value,
                name: document.getElementById('itemName').value,
                category: document.getElementById('itemCategory').value,
                icon: document.getElementById('itemIcon').value,
                rating: 'جديد ★',
                link: document.getElementById('itemLink').value
            };
            
            items.unshift(newItem);
            localStorage.setItem('remox_items', JSON.stringify(items));
            
            alert("تم نشر التطبيق/اللعبة بنجاح!");
            switchTab(newItem.type);
        }

        renderItems();
    </script>
</body>
    </html>
