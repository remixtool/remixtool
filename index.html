<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIMIX PRO - مولد الـ QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #050505; color: #ffffff; }
        .card { background-color: #121212; border: 1px solid #262626; }
        .accent-text { color: #dc2626; }
        .accent-bg { background-color: #dc2626; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

    <!-- Header -->
    <header class="card p-4 rounded-xl text-center mb-6">
        <h1 class="text-2xl font-black italic">RIMIX <span class="accent-text">PRO</span></h1>
        <p class="text-xs text-gray-400 mt-1">الأداة الأولى: مولد الـ QR المباشر</p>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-md mx-auto w-full card p-6 rounded-2xl border-red-600/40 space-y-4">
        <div class="text-center">
            <div class="w-12 h-12 rounded-full bg-red-600/10 border border-red-600/30 flex items-center justify-center mx-auto text-xl accent-text mb-2">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <h2 class="text-xl font-bold">مولد رموز الـ QR</h2>
        </div>

        <div class="space-y-3">
            <input type="text" id="qrText" placeholder="أدخل الرابط أو النص هنا..." class="w-full p-3 text-sm rounded-lg bg-zinc-900 border border-zinc-700 text-white outline-none focus:border-red-600">
            <button onclick="generateQR()" class="w-full accent-bg text-white font-bold py-2.5 rounded-lg text-sm hover:bg-red-700 transition">إنشاء الرمز 🚀</button>
        </div>

        <div id="qrResult" class="flex justify-center p-4 bg-white rounded-xl hidden mt-4"></div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-500 mt-8">
        منصة RIMIX PRO © 2026
    </footer>

    <script>
        function generateQR() {
            const input = document.getElementById('qrText').value;
            const resultBox = document.getElementById('qrResult');
            resultBox.innerHTML = "";
            
            if (input.trim() !== "") {
                resultBox.classList.remove('hidden');
                new QRCode(resultBox, {
                    text: input,
                    width: 150,
                    height: 150
                });
            } else {
                alert("يرجى كتابة نص أو رابط أولاً!");
            }
        }
    </script>
</body>
</html>
