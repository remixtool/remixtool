<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIMIX PRO - محول ومُنسق النصوص</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #050505; color: #ffffff; }
        .card { background-color: #121212; border: 1px solid #262626; }
        .accent-text { color: #dc2626; }
        .accent-bg { background-color: #dc2626; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

    <!-- Header -->
    <header class="card p-4 rounded-xl text-center mb-6">
        <h1 class="text-2xl font-black italic">RIMIX <span class="accent-text">PRO</span></h1>
        <p class="text-xs text-gray-400 mt-1">أداة تنسيق وتحويل النصوص المباشرة ⚡</p>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-md mx-auto w-full card p-6 rounded-2xl border-red-600/40 space-y-4">
        <div class="text-center">
            <div class="w-12 h-12 rounded-full bg-red-600/10 border border-red-600/30 flex items-center justify-center mx-auto text-xl accent-text mb-2">
                <i class="fa-solid fa-text-height"></i>
            </div>
            <h2 class="text-xl font-bold">محول النصوص</h2>
        </div>

        <textarea id="userText" placeholder="اكتب أو ألصق النص هنا..." class="w-full p-3 text-sm rounded-lg bg-zinc-900 border border-zinc-700 text-white h-28 outline-none focus:border-red-600"></textarea>

        <div class="grid grid-cols-2 gap-2">
            <button onclick="transformText('upper')" class="card p-2.5 text-xs font-bold hover:border-red-600 transition">أحرف كبيرة (UPPER)</button>
            <button onclick="transformText('lower')" class="card p-2.5 text-xs font-bold hover:border-red-600 transition">أحرف صغيرة (lower)</button>
            <button onclick="transformText('reverse')" class="card p-2.5 text-xs font-bold hover:border-red-600 transition">عكس النص 🔄</button>
            <button onclick="transformText('clean')" class="card p-2.5 text-xs font-bold hover:border-red-600 transition">تنظيف المسافات 🧹</button>
        </div>

        <button onclick="copyResult()" class="w-full accent-bg text-white font-bold py-2.5 rounded-lg text-sm hover:bg-red-700 transition mt-2">نسخ النص الناتج 📋</button>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-500 mt-8">
        منصة RIMIX PRO © 2026
    </footer>

    <script>
        function transformText(action) {
            const txtBox = document.getElementById('userText');
            let txt = txtBox.value;

            if (!txt.trim()) {
                alert("يرجى كتابة نص أولاً!");
                return;
            }

            if (action === 'upper') {
                txtBox.value = txt.toUpperCase();
            } else if (action === 'lower') {
                txtBox.value = txt.toLowerCase();
            } else if (action === 'reverse') {
                txtBox.value = txt.split('').reverse().join('');
            } else if (action === 'clean') {
                txtBox.value = txt.replace(/\s+/g, ' ').trim();
            }
        }

        function copyResult() {
            const txtBox = document.getElementById('userText');
            if (txtBox.value.trim()) {
                navigator.clipboard.writeText(txtBox.value);
                alert("تم نسخ النص بنجاح!");
            }
        }
    </script>
</body>
</html>
