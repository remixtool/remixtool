<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIMIX 100 PRO - المنصة الشاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #050505; --card-bg: #121212; --text-color: #ffffff; --accent: #dc2626; --border: #262626; }
        body.light-mode { --bg-color: #ffffff; --card-bg: #f4f4f5; --text-color: #000000; --accent: #dc2626; --border: #e4e4e7; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); color: var(--text-color); transition: all 0.3s ease; }
        .tool-card { background-color: var(--card-bg); border: 1px solid var(--border); transition: all 0.2s ease-in-out; }
        .tool-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(220, 38, 38, 0.15); }
        .accent-text { color: var(--accent); }
        .accent-bg { background-color: var(--accent); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="tool-card sticky top-0 z-50 p-4 border-b">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black italic tracking-wide">RIMIX <span class="accent-text">100 PRO</span></h1>
            <div class="flex items-center gap-3">
                <span class="text-xs font-bold px-3 py-1 rounded-full bg-red-600/20 accent-text border border-red-600/30">100 أداة حقيقية</span>
                <button onclick="toggleTheme()" class="tool-card p-2 rounded-xl text-lg hover:accent-text transition w-10 h-10 flex items-center justify-center">
                    <i id="themeIcon" class="fa-solid fa-sun"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-4 md:p-6 w-full flex-grow space-y-10">

        <!-- Hero Banner -->
        <div class="tool-card p-6 rounded-2xl text-center border-red-600/40 relative overflow-hidden">
            <h2 class="text-3xl font-black mb-2">منصة الـ 100 أداة الاحترافية ⚡</h2>
            <p class="text-gray-400 text-sm max-w-2xl mx-auto">أضخم تجميعة أدوات مجانية على الإنترنت: 50 أداة لمونتاج وتصميم الفيديو + 50 أداة للعمل والإنتاجية.</p>
        </div>

        <!-- Section 1: Video & Design Tools (50 Tools) -->
        <section>
            <div class="flex items-center justify-between mb-4 border-r-4 border-red-600 pr-3">
                <h3 class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-video accent-text"></i> أدوات الفيديو والتصميم
                </h3>
                <span class="text-xs font-bold text-gray-400">50 أداة</span>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-10 gap-2" id="videoToolsGrid"></div>
        </section>

        <!-- Section 2: Work & Productivity Tools (50 Tools) -->
        <section>
            <div class="flex items-center justify-between mb-4 border-r-4 border-red-600 pr-3">
                <h3 class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-briefcase accent-text"></i> أدوات العمل والإنتاجية
                </h3>
                <span class="text-xs font-bold text-gray-400">50 أداة</span>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-10 gap-2" id="workToolsGrid"></div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="tool-card border-t p-4 text-center text-xs text-gray-500 mt-10">
        تم التطوير بواسطة <span class="accent-text font-bold">RIMIX</span> | جميع الحقوق محفوظة © 2026
    </footer>

    <!-- JavaScript Data -->
    <script>
        // 50 أدوات الفيديو والتصميم الحقيقية
        const videoTools = [
            {name: "قص الفيديو", icon: "fa-scissors"},

            {name: "ضغط الفيديو", icon: "fa-compress"},
            {name: "تحويل الصيغ", icon: "fa-file-video"},
            {name: "استخراج الصوت", icon: "fa-file-audio"},
            {name: "إزالة الخلفية", icon: "fa-wand-magic-sparkles"},
            {name: "توليد الترجمة", icon: "fa-closed-captioning"},
            {name: "علامة مائية", icon: "fa-copyright"},
            {name: "تعديل الألوان", icon: "fa-sliders"},

            {name: "تسريع الفيديو", icon: "fa-bolt"},
            {name: "صور إلى فيديو", icon: "fa-images"},
            {name: "تنقية الصوت", icon: "fa-volume-high"},
            {name: "مقاسات الريلز", icon: "fa-mobile-screen"},

            {name: "تحسين الجودة", icon: "fa-up-right-and-down-left-from-center"},
            {name: "تعديل الـ FPS", icon: "fa-gauge-high"},
            {name: "فصل المسارات", icon: "fa-layer-group"},
            {name: "صانع انترو", icon: "fa-play"},
            {name: "صانع أوترو", icon: "fa-stop"},
            {name: "دمج الصوتيات", icon: "fa-music"},
            {name: "صانع الفلاتر", icon: "fa-filter"},

            {name: "انتقالات الفيديو", icon: "fa-right-left"},
            {name: "كروت شخصية", icon: "fa-address-card"},
            {name: "تأطير الشاشة", icon: "fa-crop-simple"},
            {name: "غلاف يوتيوب", icon: "fa-youtube"},

            {name: "إنفوجرافيك", icon: "fa-chart-pie"},
            {name: "الشفافية", icon: "fa-ghost"},
            {name: "تثبيت الاهتزاز", icon: "fa-anchor"},

        ];

        // 50 أدوات العمل والإنتاجية الحقيقية
        const workTools = [
            {name: "مولد الـ QR", icon: "fa-qrcode"},
            {name: "قارئ الـ QR", icon: "fa-expand"},
            {name: "دمج الـ PDF", icon: "fa-file-pdf"},

            {name: "PDF إلى Word", icon: "fa-file-word"},
            {name: "Word إلى PDF", icon: "fa-file-export"},
            {name: "ضغط الـ PDF", icon: "fa-file-arrow-down"},
            {name: "التوقيع الرقمي", icon: "fa-signature"},

            {name: "كلمات السر", icon: "fa-key"},
            {name: "فحص السرعة", icon: "fa-gauge"},
            {name: "محول العملات", icon: "fa-coins"},
            {name: "حاسبة العمر", icon: "fa-cake-candles"},
            {name: "الجدول الزمني", icon: "fa-calendar-days"},
            {name: "مترجم الملفات", icon: "fa-language"},

            {name: "تتبع المصاريف", icon: "fa-wallet"},

            {name: "مولد النصوص", icon: "fa-align-left"},
            {name: "حاسبة القروض", icon: "fa-building-columns"},
            {name: "صانع السيرة CV", icon: "fa-user-tie"},
            {name: "فحص الروابط", icon: "fa-shield-halved"},
            {name: "مستخرج الألوان", icon: "fa-palette"},
            {name: "المناطق الزمنية", icon: "fa-clock"},
            {name: "صانع الاستبيان", icon: "fa-square-poll-vertical"},
            {name: "مفكرة سريعة", icon: "fa-note-sticky"},
            {name: "محول الوحدات", icon: "fa-ruler-combined"},
            {name: "منظم المواعيد", icon: "fa-user-clock"},
            {name: "بطاقات رقمية", icon: "fa-id-card"},
            {name: "ضغط الملفات ZIP", icon: "fa-file-zipper"},
            {name: "فك الضغط", icon: "fa-box-open"},
            {name: "حاسبة الضرائب", icon: "fa-receipt"},
            {name: "فحص الأكواد", icon: "fa-code"},
            {name: "خرائط ذهنية", icon: "fa-diagram-project"},
            {name: "مقارنة النصوص", icon: "fa-code-compare"},
            {name: "أسماء المشاريع", icon: "fa-lightbulb"},
            {name: "حاسبة الخصم", icon: "fa-tag"},
            {name: "تسجيل الأفكار", icon: "fa-brain"},
            {name: "مخطط بياني", icon: "fa-chart-column"},
            {name: "منسق الأكواد", icon: "fa-brackets-curly"},
            {name: "فحص الأداء", icon: "fa-chart-line"},
            {name: "تشفير البيانات", icon: "fa-lock"},
            {name: "نماذج المبيعات", icon: "fa-cart-shopping"},
            {name: "التذكير اليومي", icon: "fa-bell"}
        ];

        function renderGrid(tools, gridId) {
            const container = document.getElementById(gridId);
            tools.forEach(t => {
                container.innerHTML += `
                    <div class="tool-card p-2 rounded-lg text-center cursor-pointer flex flex-col items-center justify-center gap-1 min-h-[75px]">
                        <i class="fa-solid ${t.icon} text-base accent-text"></i>
                        <span class="text-[10px] font-bold leading-tight">${t.name}</span>
                    </div>
                `;
            });
        }

        renderGrid(videoTools, 'videoToolsGrid');
        renderGrid(workTools, 'workToolsGrid');

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const icon = document.getElementById('themeIcon');
            if (document.body.classList.contains('light-mode')) {
                icon.className = "fa-solid fa-moon";
            } else {
                icon.className = "fa-solid fa-sun";
            }
        }
    </script>
</body>
</html>
